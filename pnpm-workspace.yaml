packages:
  - "apps/*"
  - "packages/*"

# pnpm 10+ reads these from here, not .npmrc.
#
# hoisted is required for Expo: Metro cannot resolve pnpm's default symlinked
# virtual store, and React Native breaks on duplicate React copies.
nodeLinker: hoisted
strictPeerDependencies: false
autoInstallPeers: true

allowBuilds:
  esbuild: true
